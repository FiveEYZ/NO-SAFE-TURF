# NO SAFE TURF - FiveM Enhanced / txAdmin
# Listing metadata (name, description, locale, tags) is managed in Cfx Portal.
# Open the English gameplay menu with F6 or /nst.
sv_licenseKey "{{svLicense}}"
sv_maxclients {{maxClients}}
{{serverEndpoints}}
set onesync on
sv_scriptHookAllowed 0

# Private, SERVER-ONLY connection. Never change set to setr or sets.
# txAdmin fills this from its database setup form. Do not publish this generated file.
set nst_db_connection "{{dbConnectionString}}"
# Initialize season metadata only when the imported schema is completely empty.
# Existing state/deadlines are preserved. No automatic schema creation or migration.
set nst_db_bootstrap 1
set nst_wipe_weekday 6
set nst_wipe_hour 4
set nst_wipe_minute 0

ensure mapmanager
ensure spawnmanager
ensure no_safe_turf

add_ace group.admin command allow
add_ace group.admin command.quit deny
add_ace group.admin nst.admin allow
{{addPrincipalsMaster}}

# Console checks: nst_db_status and nst_status.
# Do not start basic-gamemode or another economy/inventory/spawn framework.
