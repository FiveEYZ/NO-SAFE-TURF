# Merge into your existing txAdmin server.cfg; preserve endpoints, license and ACE settings.
set onesync on
set nst_db_config "server/mariadb.private.json"
set nst_backup_directory "server-backups"
set nst_wipe_weekday 6
set nst_wipe_hour 4
set nst_wipe_minute 0
ensure mapmanager
ensure spawnmanager
ensure nst_database_config
ensure oxmysql
# Allow only the updater to write the game resource.
set nst_auto_update 1
add_filesystem_permission nst_updater write no_safe_turf
ensure nst_updater
ensure no_safe_turf
# add_ace group.admin nst.admin allow
# add_principal identifier.license:YOUR_IDENTIFIER group.admin
