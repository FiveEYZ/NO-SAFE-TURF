$engine: 3
# Enhanced and Legacy use different artifact build-number sequences.
# Do not compare an Enhanced artifact against the Legacy 12913 threshold.
$onesync: 'on'
name: NO SAFE TURF
version: 0.7.1
author: FiveEYZ
description: Standalone English crime and survival for FiveM Enhanced. MariaDB, gangs, robberies, police and weekly seasons. No Python required.

tasks:
  # The fresh-install recipe never permits txAdmin's optional database deletion.
  - action: write_file
    file: ./tmp/nst-install-policy.json
    data: '{"dbDelete":false}'
  - action: load_vars
    src: ./tmp/nst-install-policy.json
  - action: connect_database

  # Matching prebuilt release asset; do not substitute the source-only archive.
  - action: download_file
    url: https://github.com/FiveEYZ/NO-SAFE-TURF/releases/download/v0.7.1/no-safe-turf-txadmin.zip
    path: ./tmp/nst.zip
  - action: unzip
    src: ./tmp/nst.zip
    dest: ./tmp/nst
  - action: query_database
    file: ./tmp/nst/database/mariadb/000_recipe_preflight.sql
  - action: query_database
    file: ./tmp/nst/database/mariadb/001_initial.sql

  - action: download_file
    url: https://github.com/overextended/oxmysql/releases/download/v2.14.3/oxmysql.zip
    path: ./tmp/oxmysql.zip
  - action: unzip
    src: ./tmp/oxmysql.zip
    dest: ./tmp/oxmysql
  - action: move_path
    src: ./tmp/oxmysql/oxmysql
    dest: ./resources/[standalone]/oxmysql
  # Enhanced-only compatibility adjustment to the pinned upstream manifest.
  # Node 22 remains required; 12913 is a Legacy artifact number, not Enhanced.
  - action: replace_string
    file: ./resources/[standalone]/oxmysql/fxmanifest.lua
    mode: literal
    search: '/server:12913'
    replace: '/server:177'

  # Same base-resource source as the official Enhanced Basic Server recipe.
  - action: download_github
    src: https://github.com/citizenfx/cfx-server-data
    ref: 32d98e7524b952faf8b220d719615b0346b0a6cc
    subpath: resources
    dest: ./tmp/cfx
  - action: move_path
    src: ./tmp/cfx/[managers]/mapmanager
    dest: ./resources/mapmanager
  - action: move_path
    src: ./tmp/cfx/[managers]/spawnmanager
    dest: ./resources/spawnmanager
  - action: move_path
    src: ./tmp/nst/resource
    dest: ./resources/[local]/no_safe_turf
  - action: move_path
    src: ./tmp/nst/database_config
    dest: ./resources/[local]/nst_database_config
  - action: move_path
    src: ./tmp/nst/updater
    dest: ./resources/[local]/nst_updater
  - action: move_path
    src: ./tmp/nst/deploy/recipe-server.cfg
    dest: ./server.cfg
  - action: move_path
    src: ./tmp/nst/docs
    dest: ./nst-docs
  - action: move_path
    src: ./tmp/nst/LICENSE
    dest: ./NST-LICENSE
  - action: remove_path
    path: ./tmp/nst
  - action: remove_path
    path: ./tmp/cfx
  - action: remove_path
    path: ./tmp/nst.zip
  - action: remove_path
    path: ./tmp/oxmysql
  - action: remove_path
    path: ./tmp/oxmysql.zip
  - action: remove_path
    path: ./tmp/nst-install-policy.json
