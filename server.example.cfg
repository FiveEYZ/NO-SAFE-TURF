# Isolated test server on this computer. Copy to server.cfg outside version control.
endpoint_add_tcp "127.0.0.1:30120"
endpoint_add_udp "127.0.0.1:30120"
# Configure listing metadata in Cfx Portal for Enhanced.
sv_maxclients 32
set onesync on
# Enhanced selects the supported current game build; do not use a Legacy build number.
sv_scriptHookAllowed 0
set nst_db_config "server/mariadb.private.json"
set nst_backup_directory "server-backups"
# secrets.cfg contains the Cfx license key and ACE settings.
exec secrets.cfg
ensure mapmanager
ensure spawnmanager
ensure nst_database_config
ensure oxmysql
# Do not run basic-gamemode or other inventory/economy/spawn frameworks alongside this resource.
ensure no_safe_turf
# Add the administrator identifier in secrets.cfg:
# add_ace group.admin nst.admin allow
# add_principal identifier.license:REPLACE_ME group.admin
